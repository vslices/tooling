name: Release CLI

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  publish-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Publish linux-x64
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          dotnet publish src/VSlices.Tooling \
            --configuration Release \
            --runtime linux-x64 \
            -p:Version="$VERSION" \
            --output publish/linux-x64
          chmod +x publish/linux-x64/vslices
          mkdir -p release
          zip -j release/vslices-linux-x64.zip publish/linux-x64/vslices
          sha256sum release/vslices-linux-x64.zip | awk '{print $1}' > release/vslices-linux-x64.zip.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: cli-linux-x64
          path: release/*

  publish-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Publish win-x64
        shell: pwsh
        run: |
          $version = $env:GITHUB_REF_NAME.TrimStart('v')
          dotnet publish src/VSlices.Tooling `
            --configuration Release `
            --runtime win-x64 `
            -p:Version=$version `
            --output publish/win-x64

          New-Item -ItemType Directory -Force release | Out-Null
          Compress-Archive -Path publish/win-x64/vslices.exe -DestinationPath release/vslices-win-x64.zip
          (Get-FileHash release/vslices-win-x64.zip -Algorithm SHA256).Hash.ToLowerInvariant() |
            Set-Content -NoNewline release/vslices-win-x64.zip.sha256

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress -y

      - name: Build Windows installer
        shell: pwsh
        run: |
          $version = $env:GITHUB_REF_NAME.TrimStart('v')
          $sourceDir = (Resolve-Path publish/win-x64).Path
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"

          & $iscc `
            "/DAppVersion=$version" `
            "/DSourceDir=$sourceDir" `
            installer/windows/VSlices.Tooling.iss

          Copy-Item `
            installer/windows/output/VSlices-Tooling-Setup-win-x64.exe `
            release/VSlices-Tooling-Setup-win-x64.exe

          (Get-FileHash release/VSlices-Tooling-Setup-win-x64.exe -Algorithm SHA256).Hash.ToLowerInvariant() |
            Set-Content -NoNewline release/VSlices-Tooling-Setup-win-x64.exe.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: cli-win-x64
          path: release/*

  release:
    needs: [publish-linux, publish-windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: cli-*
          path: release-assets
          merge-multiple: true
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          PRERELEASE=""
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then
            PRERELEASE="--prerelease"
          fi
          gh release create "$GITHUB_REF_NAME" \
            release-assets/* \
            --repo "$GITHUB_REPOSITORY" \
            --generate-notes \
            $PRERELEASE
