name: Release CLI

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  publish-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Publish linux-x64
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          dotnet publish src/VSlices.Tooling \
            --configuration Release \
            --runtime linux-x64 \
            -p:Version="$VERSION" \
            --output publish/linux-x64
          chmod +x publish/linux-x64/vslices
          test -f publish/linux-x64/refactor/VSlices.Targets.DotNet.Refactor.dll
          mkdir -p release
          (
            cd publish/linux-x64
            zip -r "$GITHUB_WORKSPACE/release/vslices-linux-x64.zip" vslices refactor
          )
          sha256sum release/vslices-linux-x64.zip | awk '{print $1}' > release/vslices-linux-x64.zip.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: cli-linux-x64
          path: release/*

  publish-windows:
    strategy:
      matrix:
        rid: [win-x64, win-arm64]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Publish ${{ matrix.rid }}
        shell: pwsh
        run: |
          $version = $env:GITHUB_REF_NAME.TrimStart('v')
          $rid = '${{ matrix.rid }}'
          dotnet publish src/VSlices.Tooling `
            --configuration Release `
            --runtime $rid `
            -p:Version=$version `
            --output "publish/$rid"

          if (-not (Test-Path "publish/$rid/refactor/VSlices.Targets.DotNet.Refactor.dll")) {
            throw 'Roslyn semantic-refactoring companion helper was not published.'
          }

          New-Item -ItemType Directory -Force release | Out-Null
          $archive = "release/vslices-$rid.zip"
          Compress-Archive `
            -Path "publish/$rid/vslices.exe", "publish/$rid/refactor" `
            -DestinationPath $archive
          (Get-FileHash $archive -Algorithm SHA256).Hash.ToLowerInvariant() |
            Set-Content -NoNewline "$archive.sha256"

      - uses: actions/upload-artifact@v4
        with:
          name: cli-${{ matrix.rid }}
          path: release/*

  release:
    needs: [publish-linux, publish-windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: cli-*
          path: release-assets
          merge-multiple: true
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          PRERELEASE=""
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then
            PRERELEASE="--prerelease"
          fi
          gh release create "$GITHUB_REF_NAME" \
            release-assets/* \
            --repo "$GITHUB_REPOSITORY" \
            --generate-notes \
            $PRERELEASE

  verify-windows-bootstrap:
    needs: release
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install from the published GitHub Release
        shell: pwsh
        run: |
          $version = $env:GITHUB_REF_NAME.TrimStart('v')
          $installPath = Join-Path $env:RUNNER_TEMP 'vslices-bin'
          ./install.ps1 -Version $version -InstallPath $installPath -SkipPath

          $vslices = Join-Path $installPath 'vslices.exe'
          $helper = Join-Path $installPath 'refactor\VSlices.Targets.DotNet.Refactor.dll'
          if (-not (Test-Path $vslices)) {
            throw "Bootstrap did not install '$vslices'."
          }
          if (-not (Test-Path $helper)) {
            throw "Bootstrap did not install '$helper'."
          }

          & $vslices --help | Out-String | Write-Host
          if ($LASTEXITCODE -ne 0) {
            throw 'Installed VSlices executable did not run successfully.'
          }

          & $vslices update --self --check --channel preview
          if ($LASTEXITCODE -ne 0) {
            throw 'Installed VSlices executable could not validate its published release through update --self --check.'
          }
