name: macOS Native AOT

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
  workflow_dispatch:

concurrency:
  group: macos-${{ github.event.pull_request.number && format('pr-{0}', github.event.pull_request.number) || format('{0}-{1}', github.event_name, github.ref) }}
  cancel-in-progress: true

jobs:
  macos-native-aot:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Verify Apple Silicon runner
        shell: bash
        run: |
          test "$(uname -m)" = "arm64"

      - name: Publish osx-arm64 Native AOT CLI
        shell: bash
        run: |
          VERSION_ARGS=()
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            VERSION_ARGS=(-p:Version="0.0.0-build.${{ github.event.pull_request.number }}.${{ github.run_number }}")
          fi

          dotnet publish src/VSlices.Tooling \
            --configuration Release \
            --runtime osx-arm64 \
            "${VERSION_ARGS[@]}"

      - name: Smoke test osx-arm64 executable and companion helper
        shell: bash
        run: |
          PUBLISH="$GITHUB_WORKSPACE/src/VSlices.Tooling/bin/Release/net10.0/osx-arm64/publish"
          VSLICES="$PUBLISH/vslices"

          test -x "$VSLICES"
          test -f "$PUBLISH/refactor/VSlices.Targets.DotNet.Refactor.dll"

          "$VSLICES" --help | grep -q "init"
          "$VSLICES" --help | grep -q "lower"
          "$VSLICES" --help | grep -q "transpile"
          "$VSLICES" --help | grep -q "rebase"
          "$VSLICES" --help | grep -q "update"

          LONG_VERSION="$("$VSLICES" --version)"
          SHORT_VERSION="$("$VSLICES" -v)"
          test -n "$LONG_VERSION"
          test "$LONG_VERSION" = "$SHORT_VERSION"
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            test "$LONG_VERSION" = "build${{ github.event.pull_request.number }}.${{ github.run_number }}"
          fi

          mkdir -p native-aot-context
          cp tests/VSlices.Vsir.CSharp.Tests/Fixtures/StreetName.vsir native-aot-context/StreetName.vsir
          cd native-aot-context

          "$VSLICES" init --from "$GITHUB_WORKSPACE/.vslices/ruleset" --target C#
          test -f .vslices/config.yaml
          test -f .vslices/.ignore
          test -f .vslices/ruleset/manifest.yaml
          test -d .vslices/ruleset/csharp

          "$VSLICES" transpile StreetName.vsir \
            --namespace Identities.Domain.ValueObjects \
            --stdout \
            > native-transpiled.cs

          grep -q "sealed class StreetName" native-transpiled.cs
          grep -q "namespace Identities.Domain.ValueObjects" native-transpiled.cs

      - name: Package osx-arm64 PR build
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          mkdir -p pr-build/osx-arm64
          PUBLISH="$GITHUB_WORKSPACE/src/VSlices.Tooling/bin/Release/net10.0/osx-arm64/publish"
          (
            cd "$PUBLISH"
            zip -r "$GITHUB_WORKSPACE/pr-build/osx-arm64/vslices-osx-arm64.zip" vslices refactor
          )
          shasum -a 256 pr-build/osx-arm64/vslices-osx-arm64.zip | awk '{print $1}' > pr-build/osx-arm64/vslices-osx-arm64.zip.sha256

      - name: Upload osx-arm64 PR build
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: build${{ github.event.pull_request.number }}.${{ github.run_number }}-osx-arm64
          path: pr-build/osx-arm64/*
          if-no-files-found: error
