name: CI

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

concurrency:
  group: ci-${{ github.event.pull_request.number && format('pr-{0}', github.event.pull_request.number) || format('{0}-{1}', github.event_name, github.ref) }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - run: dotnet build tooling.slnx --configuration Release
      - run: dotnet test tooling.slnx --configuration Release --no-build

      - name: Smoke test Roslyn semantic namespace blast radius
        shell: bash
        run: |
          mkdir -p semantic-refactor-context/Demo
          cat > semantic-refactor-context/Demo/Demo.csproj <<'EOF'
          <Project Sdk="Microsoft.NET.Sdk">
            <PropertyGroup>
              <TargetFramework>net10.0</TargetFramework>
            </PropertyGroup>
          </Project>
          EOF
          cat > semantic-refactor-context/Demo/TicketCode.cs <<'EOF'
          namespace Demo.Domain;

          public sealed class TicketCode
          {
              public sealed class Input;
          }
          EOF
          cat > semantic-refactor-context/Demo/Consumer.cs <<'EOF'
          using static Demo.Domain.TicketCode;

          namespace Demo.Consumer;

          public sealed class Consumer
          {
              private readonly Demo.Domain.TicketCode _code = new();
              private readonly Input _input = new();
          }
          EOF
          cat > semantic-refactor-context/TicketCode.candidate.cs <<'EOF'
          namespace Demo.Domain.Aggregates;

          public sealed class TicketCode
          {
              public sealed class Input;
          }
          EOF
          dotnet new sln --format slnx -n SemanticRefactor -o semantic-refactor-context
          dotnet sln semantic-refactor-context/SemanticRefactor.slnx add semantic-refactor-context/Demo/Demo.csproj
          dotnet build semantic-refactor-context/SemanticRefactor.slnx --configuration Release

          BEFORE_TICKET="$(sha256sum semantic-refactor-context/Demo/TicketCode.cs | awk '{print $1}')"
          BEFORE_CONSUMER="$(sha256sum semantic-refactor-context/Demo/Consumer.cs | awk '{print $1}')"
          mkdir -p semantic-refactor-context/staged
          dotnet src/VSlices.Targets.DotNet.Refactor/bin/Release/net10.0/VSlices.Targets.DotNet.Refactor.dll \
            --project semantic-refactor-context/Demo/Demo.csproj \
            --document semantic-refactor-context/Demo/TicketCode.cs \
            --candidate semantic-refactor-context/TicketCode.candidate.cs \
            --symbol TicketCode \
            --staging semantic-refactor-context/staged \
            --manifest semantic-refactor-context/manifest.json

          jq -e '.Success == true' semantic-refactor-context/manifest.json >/dev/null
          jq -e '.NamespaceChanged == true' semantic-refactor-context/manifest.json >/dev/null
          jq -e '.RequiresAuthorization == true' semantic-refactor-context/manifest.json >/dev/null
          jq -e '.ReferenceCount >= 2' semantic-refactor-context/manifest.json >/dev/null
          jq -e '.PreviousSymbol == "Demo.Domain.TicketCode"' semantic-refactor-context/manifest.json >/dev/null
          jq -e '.NextSymbol == "Demo.Domain.Aggregates.TicketCode"' semantic-refactor-context/manifest.json >/dev/null
          grep -R -q 'global::Demo.Domain.Aggregates.TicketCode' semantic-refactor-context/staged
          test "$BEFORE_TICKET" = "$(sha256sum semantic-refactor-context/Demo/TicketCode.cs | awk '{print $1}')"
          test "$BEFORE_CONSUMER" = "$(sha256sum semantic-refactor-context/Demo/Consumer.cs | awk '{print $1}')"

      - name: Validate Windows bootstrap script syntax
        shell: pwsh
        run: '[scriptblock]::Create((Get-Content ./install.ps1 -Raw)) | Out-Null'

      - name: Smoke test explicit stdout
        run: |
          dotnet run --project src/VSlices.Tooling --configuration Release --no-build -- \
            transpile tests/VSlices.Vsir.CSharp.Tests/Fixtures/StreetName.vsir \
            -to C# \
            --namespace Identities.Domain.ValueObjects \
            --stdout \
            > transpiled.cs
          grep -q "sealed class StreetName" transpiled.cs
          grep -q "namespace Identities.Domain.ValueObjects" transpiled.cs

      - name: Smoke test lower writes conventional materialization
        run: |
          mkdir -p lower-context
          cp tests/VSlices.Vsir.CSharp.Tests/Fixtures/StreetName.vsir lower-context/StreetName.vsir
          dotnet run --project src/VSlices.Tooling --configuration Release --no-build -- \
            lower lower-context/StreetName.vsir \
            --namespace Identities.Domain.ValueObjects
          test -f lower-context/StreetName.vsir.cs
          grep -q "sealed class StreetName" lower-context/StreetName.vsir.cs

      - name: Smoke test rebase preserves human materialization when VSIR is unchanged
        run: |
          mkdir -p rebase-context
          cp tests/VSlices.Vsir.CSharp.Tests/Fixtures/StreetName.vsir rebase-context/Previous.vsir
          cp tests/VSlices.Vsir.CSharp.Tests/Fixtures/StreetName.vsir rebase-context/StreetName.vsir
          dotnet run --project src/VSlices.Tooling --configuration Release --no-build -- \
            transpile rebase-context/StreetName.vsir \
            --namespace Identities.Domain.ValueObjects
          printf '\n// human detail\n' >> rebase-context/StreetName.vsir.cs
          dotnet run --project src/VSlices.Tooling --configuration Release --no-build -- \
            rebase rebase-context/StreetName.vsir \
            --from rebase-context/Previous.vsir \
            --namespace Identities.Domain.ValueObjects
          grep -q "human detail" rebase-context/StreetName.vsir.cs

      - name: Smoke test ruleset update validates before swap
        run: |
          VSLICES="dotnet run --project $GITHUB_WORKSPACE/src/VSlices.Tooling --configuration Release --no-build --"
          mkdir -p ruleset-update-context
          cd ruleset-update-context
          $VSLICES init --from "$GITHUB_WORKSPACE/.vslices/ruleset" --target C#
          test -f .vslices/ruleset/csharp/intrinsics.yaml
          rm .vslices/ruleset/csharp/intrinsics.yaml
          $VSLICES update --ruleset
          test -f .vslices/ruleset/csharp/intrinsics.yaml
          test -z "$(find .vslices -maxdepth 1 \( -name '.ruleset-update-*' -o -name '.ruleset-backup-*' \) -print -quit)"

      - name: Smoke test lineage bootstrap and subsequent automatic rebase
        run: |
          VSLICES="dotnet run --project $GITHUB_WORKSPACE/src/VSlices.Tooling --configuration Release --no-build --"
          mkdir -p lineage-context
          cp tests/VSlices.Vsir.CSharp.Tests/Fixtures/StreetName.vsir lineage-context/StreetName.vsir
          cd lineage-context
          $VSLICES init --from "$GITHUB_WORKSPACE/.vslices/ruleset" --target C#
          $VSLICES transpile StreetName.vsir --namespace Identities.Domain.ValueObjects
          printf '\n// human detail\n' >> StreetName.vsir.cs
          BEFORE="$(sha256sum StreetName.vsir.cs | awk '{print $1}')"
          $VSLICES lower StreetName.vsir --namespace Identities.Domain.ValueObjects
          AFTER="$(sha256sum StreetName.vsir.cs | awk '{print $1}')"
          test "$BEFORE" = "$AFTER"
          test -f .vslices/lineage/csharp/StreetName.vsir.cs.baseline
          sed -i 's/max: 30/max: 31/' StreetName.vsir
          $VSLICES lower StreetName.vsir --namespace Identities.Domain.ValueObjects
          grep -q '<= 31' StreetName.vsir.cs
          grep -q 'human detail' StreetName.vsir.cs

      - name: Smoke test artifact discovery ignores
        run: |
          VSLICES="dotnet run --project $GITHUB_WORKSPACE/src/VSlices.Tooling --configuration Release --no-build --"
          mkdir -p discovery-context/many/folders discovery-context/{.git,.vslices,bin,obj,legacy}
          cp tests/VSlices.Vsir.CSharp.Tests/Fixtures/StreetName.vsir discovery-context/many/folders/StreetName.vsir
          cp tests/VSlices.Vsir.CSharp.Tests/Fixtures/StreetName.vsir discovery-context/.git/StreetName.vsir
          cp tests/VSlices.Vsir.CSharp.Tests/Fixtures/StreetName.vsir discovery-context/.vslices/StreetName.vsir
          cp tests/VSlices.Vsir.CSharp.Tests/Fixtures/StreetName.vsir discovery-context/bin/StreetName.vsir
          cp tests/VSlices.Vsir.CSharp.Tests/Fixtures/StreetName.vsir discovery-context/obj/StreetName.vsir
          cp tests/VSlices.Vsir.CSharp.Tests/Fixtures/StreetName.vsir discovery-context/legacy/StreetName.vsir
          cp -R .vslices/ruleset discovery-context/.vslices/ruleset
          printf '# Project-specific ignore\nlegacy/\n' > discovery-context/.vslices/.ignore
          cd discovery-context
          $VSLICES lower StreetName --namespace Identities.Domain.ValueObjects
          test -f many/folders/StreetName.vsir.cs
          grep -q "sealed class StreetName" many/folders/StreetName.vsir.cs

      - name: Smoke test .NET target context derivation
        run: |
          mkdir -p target-context/ValueObjects
          cat > target-context/Demo.Identity.csproj <<'EOF'
          <Project Sdk="Microsoft.NET.Sdk">
            <PropertyGroup>
              <TargetFramework>net10.0</TargetFramework>
              <RootNamespace>Demo.Identity</RootNamespace>
            </PropertyGroup>
          </Project>
          EOF
          cp tests/VSlices.Vsir.CSharp.Tests/Fixtures/StreetName.vsir target-context/ValueObjects/StreetName.vsir
          dotnet restore target-context/Demo.Identity.csproj
          dotnet run --project src/VSlices.Tooling --configuration Release --no-build -- \
            transpile target-context/ValueObjects/StreetName.vsir \
            --stdout \
            > delegated.cs
          grep -q "namespace Demo.Identity.ValueObjects" delegated.cs

      - name: Publish Native AOT CLI
        shell: bash
        run: |
          VERSION_ARGS=()
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            VERSION_ARGS=(-p:Version="0.0.0-build.${{ github.event.pull_request.number }}.${{ github.run_number }}")
          fi
          dotnet publish src/VSlices.Tooling \
            --configuration Release \
            --runtime linux-x64 \
            "${VERSION_ARGS[@]}"

      - name: Smoke test Native AOT executable, version, init, config, and companion helper
        shell: bash
        run: |
          PUBLISH="$GITHUB_WORKSPACE/src/VSlices.Tooling/bin/Release/net10.0/linux-x64/publish"
          VSLICES="$PUBLISH/vslices"
          test -f "$PUBLISH/refactor/VSlices.Targets.DotNet.Refactor.dll"
          "$VSLICES" --help | grep -q "init"
          "$VSLICES" --help | grep -q "lower"
          "$VSLICES" --help | grep -q "transpile"
          "$VSLICES" --help | grep -q "rebase"
          "$VSLICES" --help | grep -q "update"

          LONG_VERSION="$("$VSLICES" --version)"
          SHORT_VERSION="$("$VSLICES" -v)"
          test -n "$LONG_VERSION"
          test "$LONG_VERSION" = "$SHORT_VERSION"
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            test "$LONG_VERSION" = "build${{ github.event.pull_request.number }}.${{ github.run_number }}"
          fi

          mkdir -p native-aot-context
          cp tests/VSlices.Vsir.CSharp.Tests/Fixtures/StreetName.vsir native-aot-context/StreetName.vsir
          cd native-aot-context

          "$VSLICES" init --from "$GITHUB_WORKSPACE/.vslices/ruleset" --target C#
          test -f .vslices/config.yaml
          test -f .vslices/.ignore
          test -f .vslices/ruleset/manifest.yaml
          test -d .vslices/ruleset/csharp
          grep -q "default: csharp" .vslices/config.yaml
          grep -q "source: https://github.com/vslices/tooling" .vslices/config.yaml
          grep -q "channel: preview" .vslices/config.yaml

          "$VSLICES" transpile StreetName.vsir \
            --namespace Identities.Domain.ValueObjects \
            --stdout \
            > native-transpiled.cs
          grep -q "sealed class StreetName" native-transpiled.cs

      - name: Package linux-x64 PR build
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          mkdir -p pr-build/linux-x64
          PUBLISH="$GITHUB_WORKSPACE/src/VSlices.Tooling/bin/Release/net10.0/linux-x64/publish"
          (
            cd "$PUBLISH"
            zip -r "$GITHUB_WORKSPACE/pr-build/linux-x64/vslices-linux-x64.zip" vslices refactor
          )
          sha256sum pr-build/linux-x64/vslices-linux-x64.zip | awk '{print $1}' > pr-build/linux-x64/vslices-linux-x64.zip.sha256

      - name: Upload linux-x64 PR build
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: build${{ github.event.pull_request.number }}.${{ github.run_number }}-linux-x64
          path: pr-build/linux-x64/*
          if-no-files-found: error

  windows-native-aot:
    strategy:
      matrix:
        rid: [win-x64, win-arm64]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Publish ${{ matrix.rid }} Native AOT CLI
        shell: pwsh
        run: |
          $versionArgs = @()
          if ('${{ github.event_name }}' -eq 'pull_request') {
            $versionArgs = @('-p:Version=0.0.0-build.${{ github.event.pull_request.number }}.${{ github.run_number }}')
          }
          dotnet publish src/VSlices.Tooling `
            --configuration Release `
            --runtime ${{ matrix.rid }} `
            @versionArgs

          $publish = "src/VSlices.Tooling/bin/Release/net10.0/${{ matrix.rid }}/publish"
          if (-not (Test-Path "$publish/refactor/VSlices.Targets.DotNet.Refactor.dll")) {
            throw 'Roslyn semantic-refactoring companion helper was not published.'
          }

      - name: Package ${{ matrix.rid }} PR build
        if: github.event_name == 'pull_request'
        shell: pwsh
        run: |
          $rid = '${{ matrix.rid }}'
          $directory = "pr-build/$rid"
          New-Item -ItemType Directory -Force $directory | Out-Null
          $archive = "$directory/vslices-$rid.zip"
          $publish = "src/VSlices.Tooling/bin/Release/net10.0/$rid/publish"
          Compress-Archive `
            -Path "$publish/vslices.exe", "$publish/refactor" `
            -DestinationPath $archive
          (Get-FileHash $archive -Algorithm SHA256).Hash.ToLowerInvariant() |
            Set-Content -NoNewline "$archive.sha256"

      - name: Upload ${{ matrix.rid }} PR build
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: build${{ github.event.pull_request.number }}.${{ github.run_number }}-${{ matrix.rid }}
          path: pr-build/${{ matrix.rid }}/*
          if-no-files-found: error

  pr-build-summary:
    if: github.event_name == 'pull_request'
    needs: [test, windows-native-aot]
    runs-on: ubuntu-latest
    permissions:
      actions: read
    steps:
      - name: Add PR build links to workflow summary
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          BUILD="build${{ github.event.pull_request.number }}.${{ github.run_number }}"
          ARTIFACTS="$(gh api "/repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/artifacts" --paginate --jq '.artifacts[] | select(.name | startswith("'"$BUILD"'")) | [.name, (.id | tostring)] | @tsv')"

          {
            echo "## ${BUILD}"
            echo
            echo "Installable Native AOT artifacts for PR #${{ github.event.pull_request.number }}."
            echo
            echo "| Runtime | Artifact |"
            echo "| --- | --- |"

            while IFS=$'\t' read -r name id; do
              [[ -z "$name" || -z "$id" ]] && continue
              rid="${name#${BUILD}-}"
              url="https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/artifacts/${id}"
              echo "| \`${rid}\` | [\`${name}\`](${url}) |"
            done <<< "$ARTIFACTS"

            echo
            echo "Artifacts now contain the Native AOT CLI plus its managed Roslyn refactoring companion under \`refactor/\`."
            echo "After bootstrapping one helper-aware PR build, configure \`updates.channel: build\` and \`updates.pull-request: ${{ github.event.pull_request.number }}\` so \`vslices update --self\` can follow later successful builds automatically."
          } >> "$GITHUB_STEP_SUMMARY"
